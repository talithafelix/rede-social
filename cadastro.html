<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Minha Rede Social</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="tela-centralizada">
    <div class="cartao">
      <h1>Criar conta</h1>

      <p id="mensagem-erro" class="mensagem-erro" hidden></p>
      <p id="mensagem-sucesso" class="mensagem-sucesso" hidden></p>

      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <label for="senha">Criar senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>

        <button type="submit" class="botao-primario">Cadastrar</button>
      </form>

      <p class="texto-secundario">
        Já possui uma conta? <a href="index.html">Faça login aqui</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
