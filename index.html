<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Minha Rede Social</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="tela-centralizada">
    <div class="cartao">
      <h1>Entrar</h1>

      <p id="mensagem-erro" class="mensagem-erro" hidden></p>

      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua senha" required>

        <button type="submit" class="botao-primario">Login</button>
      </form>

      <p class="texto-secundario">
        Ainda não possui login? <a href="cadastro.html">Cadastre-se aqui</a>
      </p>
    </div>
  </main>

  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
